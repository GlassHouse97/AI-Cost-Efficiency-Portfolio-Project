name: Validate data and dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python TECHNICAL/scripts/validate_data.py
      - name: Verify committed case-study evidence tables
        run: |
          python TECHNICAL/scripts/analyze_case_study.py
          git diff --exit-code -- 'SOLUTION/TRACKS/portfolio-project/outputs/*.csv'
      - run: python -m unittest discover -s TECHNICAL/tests -p "test_*.py" -v
      - run: npm --prefix TECHNICAL test
      - run: python TECHNICAL/scripts/package_learners.py --check
      - run: npm --prefix TECHNICAL run build
